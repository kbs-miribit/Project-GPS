services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gps}
      POSTGRES_DB: ${POSTGRES_DB:-gps}
    # 서버 내부에서만 접속 가능하도록 localhost에만 바인딩
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gps} -d ${POSTGRES_DB:-gps}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 서버 내부에서만 접속 가능하도록 localhost에만 바인딩
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gps}:${POSTGRES_PASSWORD:-gps}@postgres:5432/${POSTGRES_DB:-gps}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js 서버가 /api 요청을 넘겨줄 백엔드 주소 (빌드 시점에 반영됨)
        BACKEND_URL: http://backend:8000
    # 게이트웨이 nginx가 geolocationapi.miribit.cloud 요청을 이 VM의 80번으로 전달함
    ports:
      - "80:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
